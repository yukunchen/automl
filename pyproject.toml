[project]
name = "autoresearch-cv"
version = "0.1.0"
description = "Autonomous CV detection distillation: PC -> mobile (Snapdragon 8 Gen 1)"
readme = "README.md"
requires-python = ">=3.10"
# Note: actual dependency versions are pinned per-venv by setup_train.sh.
# - .venv-train uses the AutoDL preinstalled torch 2.7.0+cu128 via system-site-packages
# - .venv-deploy installs torch 2.x + qai-hub independently
dependencies = [
    "torch",
    "torchvision",
    "pycocotools",
    "numpy",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
deploy = ["qai-hub", "onnx", "onnxruntime"]
